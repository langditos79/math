<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <!-- Fake Google Favicon -->
    <link rel="icon" href="https://www.google.com/favicon.ico">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }
        /* The proxy iframe */
        #proxy-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- 
      INCOPROXY IS USED HERE. 
      If IncogniProxy is blocked at your school, replace the src with:
      https://hider.io/?u=
      or your own Cloudflare Worker URL.
    -->
    <iframe id="proxy-frame" src="https://incogniproxy.com/?u="></iframe>

    <script>
        // 1. CLOAK THE URL
        // This changes the address bar to 'about:blank'
        history.replaceState(null, null, 'about:blank');

        // 2. DISGUISE THE TAB
        // Sets the tab title to 'Google'
        document.title = 'Google';

        // 3. PREVENT BACK BUTTON
        // Makes it harder for users to navigate back out of the cloak
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            history.go(1);
        };
    </script>
</body>
</html>
